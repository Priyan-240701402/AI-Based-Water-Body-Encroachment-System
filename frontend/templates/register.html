{% extends "base.html" %}

{% block title %}Citizen Registration | Water Body Encroachment System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg p-4 rounded-4">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-info-subtle text-info-emphasis mb-2">
            <i class="bi bi-person-plus-fill fs-2"></i>
          </div>
          <h3 class="fw-bold">Create Account</h3>
          <p class="text-muted small">Register as a Citizen to lodge & track encroachment complaints</p>
        </div>

        <div id="regError" class="alert alert-danger d-none py-2 small"></div>
        <div id="regSuccess" class="alert alert-success d-none py-2 small"></div>

        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Ravi Kumar" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="ravi@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="+91-9876543210">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password (min 6 characters)</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Account Role</label>
            <select id="role" class="form-select">
              <option value="citizen" selected>Citizen / Resident</option>
              <option value="authority">Survey & Verification Officer</option>
            </select>
          </div>
          <button type="submit" id="regBtn" class="btn btn-primary w-100 py-2 fw-semibold">
            <span id="regSpinner" class="spinner-border spinner-border-sm me-1 d-none"></span> Create Account
          </button>
        </form>

        <div class="text-center mt-4">
          <span class="small text-muted">Already have an account? </span>
          <a href="{{ url_for('web.login_page') }}" class="small fw-semibold text-decoration-none">Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const errorBox = document.getElementById('regError');
  const successBox = document.getElementById('regSuccess');
  const spinner = document.getElementById('regSpinner');
  const btn = document.getElementById('regBtn');

  errorBox.classList.add('d-none');
  successBox.classList.add('d-none');
  spinner.classList.remove('d-none');
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
      })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      successBox.textContent = 'Account registered successfully! Redirecting...';
      successBox.classList.remove('d-none');
      setTimeout(() => {
        if (data.user.role === 'citizen') {
          window.location.href = '/citizen/dashboard';
        } else {
          window.location.href = '/admin/dashboard';
        }
      }, 1000);
    } else {
      errorBox.textContent = data.message || 'Registration failed.';
      errorBox.classList.remove('d-none');
    }
  } catch (err) {
    errorBox.textContent = 'Server connection error: ' + err.message;
    errorBox.classList.remove('d-none');
  } finally {
    spinner.classList.add('d-none');
    btn.disabled = false;
  }
});
</script>
{% endblock %}
